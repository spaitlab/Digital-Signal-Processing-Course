name: Build and publish course website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install navigation build dependencies
        run: python -m pip install -r 课程网站/tools/requirements.txt
      - name: Render seven-chapter website
        run: quarto render 课程网站
      - name: Check local links and publication exclusions
        run: python3 scripts/check_site.py 课程网站/_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 课程网站/_site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
